<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DHC 앵커사업 통합 성과관리 DASHBOARD</title>
<style>
:root{--dhc:#B40059;--deep:#750038;--mid:#CE3B7F;--soft:#F5DCE8;--pale:#FDF7FA;--ink:#202329;--text:#484F57;--muted:#9298A0;--line:#E5E8EB;--bg:#F4F5F7;--good:#2F8064;--warn:#C88B24;--manage:#D5732F;--risk:#C14951}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;color:var(--text)}
button,select{font:inherit;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1200px;margin:auto;padding:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.logo{width:250px;max-width:52vw} .title{font-size:12px;font-weight:950;color:var(--dhc);text-align:right}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;margin-bottom:12px}
.field label{display:block;font-size:9px;font-weight:900;color:var(--muted);margin-bottom:5px}
select{width:100%;min-height:44px;border:1px solid #D9DDE1;border-radius:10px;padding:9px 10px;background:#fff;color:#444;font-size:11px;outline:none}
select:focus{border-color:var(--dhc);box-shadow:0 0 0 3px rgba(180,0,89,.08)}
.apply{align-self:end;min-height:44px;border:0;border-radius:10px;padding:10px 17px;background:var(--dhc);color:white;font-size:11px;font-weight:950;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;transition:transform .25s ease,opacity .25s ease}
.kpi.primary{background:linear-gradient(135deg,var(--deep),var(--dhc));color:#fff;border:0}
.kpi small{font-size:10px;font-weight:850;color:var(--muted)} .kpi.primary small{color:#f0c4d8}
.kpi b{display:block;font-size:24px;margin-top:7px;color:var(--ink)} .kpi.primary b{color:#fff}
.kpi p{font-size:9px;color:#9AA0A7;margin:3px 0 0} .kpi.primary p{color:#F1C6D9}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:12px;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px} .card h3{font-size:14px;margin:0;color:var(--ink)} .hint{font-size:9px;color:var(--muted)}
.task-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.task-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:linear-gradient(#fff,#FFFAFC);opacity:0;transform:translateY(8px);animation:cardIn .36s ease forwards}
.task-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px} .task-head strong{font-size:11px;color:var(--ink)} .task-head em{font-size:8px;font-style:normal;color:var(--muted)}
.metric{display:grid;grid-template-columns:47px 1fr 45px;gap:6px;align-items:center;margin:6px 0} .metric span{font-size:8.5px;font-weight:850;color:#666D75} .metric b{font-size:8.5px;text-align:right}
.track{height:7px;background:#EEF0F2;border-radius:99px;overflow:hidden} .bar{height:100%;width:0;border-radius:99px;transition:width .65s cubic-bezier(.22,.8,.3,1)}
.donut-wrap{display:grid;place-items:center;padding:6px 0 12px}
.donut{width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center;transition:background .55s ease}
.donut:after{content:"";position:absolute;width:96px;height:96px;border-radius:50%;background:#fff}
.donut-center{position:relative;z-index:1;text-align:center} .donut-center b{font-size:24px;color:var(--ink)} .donut-center small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px} .legend div{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border-radius:8px;background:#FAFBFC;font-size:9px} .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.risk-item{display:grid;grid-template-columns:44px 1fr 52px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #EEF0F2;opacity:0;animation:fade .3s ease forwards} .risk-item>span{font-size:9px;font-weight:900} .risk-item b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .risk-item small{font-size:8px;color:var(--muted)} .risk-item strong{font-size:9px;text-align:right;color:var(--risk)}
.univ-row{display:grid;grid-template-columns:90px 1fr 48px;gap:8px;align-items:center;margin:10px 0} .univ-row span{font-size:10px;font-weight:850} .univ-row b{font-size:10px;text-align:right} .track.large{height:9px}
.empty{grid-column:1/-1;padding:34px;text-align:center;color:var(--muted);font-size:10px}
.flash{animation:flash .35s ease}
@keyframes cardIn{to{opacity:1;transform:none}} @keyframes fade{to{opacity:1}} @keyframes flash{0%{opacity:.35}100%{opacity:1}}
@media(max-width:720px){
 .wrap{padding:10px}
 .top{padding:10px} .title{font-size:10px}
 .filters{grid-template-columns:1fr 1fr}
 .apply{grid-column:1/-1;width:100%}
 .kpis{grid-template-columns:1fr 1fr}
 .grid{grid-template-columns:1fr}
 .task-grid{grid-template-columns:1fr}
 .univ-row{grid-template-columns:76px 1fr 44px}
}
@media(max-width:430px){.filters{grid-template-columns:1fr}.apply{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.task-card,.risk-item{opacity:1;transform:none}}
</style>
</head>

    return DATA.filter(x=>
      (els.univ.value==='전체'||x.대학===els.univ.value) &&
      (els.task.value==='전체'||x.단위과제===els.task.value) &&
      (els.type.value==='전체'||String(x.구분).startsWith(els.type.value)) &&
      (els.state.value==='전체'||status(x.달성률)===els.state.value)
    );
  }

  function pctDone(arr){
    return arr.length?arr.filter(x=>x.달성률>=100).length/arr.length*100:0;
  }

  function render(){
    const d=filtered();
    const done=d.filter(x=>x.달성률>=100).length;
    const core=d.filter(x=>String(x.구분).startsWith('핵심'));
    const auto=d.filter(x=>String(x.구분).startsWith('자율'));
    const totalRate=d.length?done/d.length*100:0;

    els.kRate.textContent=totalRate.toFixed(1)+'%';
    els.kRateSub.textContent=done+' / '+d.length+'개 지표';
    els.kTotal.textContent=d.length+'개';
    els.kDone.textContent=done+'개';
    els.kCore.textContent=(core.length?pctDone(core):0).toFixed(1)+'%';
    els.kAuto.textContent=(auto.length?pctDone(auto):0).toFixed(1)+'%';
    els.kpis.classList.remove('flash'); void els.kpis.offsetWidth; els.kpis.classList.add('flash');

    const groups={};
    d.forEach(x=>{const key=(els.univ.value==='전체'?x.단위과제+'|'+x.대학:x.단위과제);(groups[key]||(groups[key]=[])).push(x);});
    const slots=['핵심 ①','핵심 ②','자율 ①','자율 ②'];
    els.taskGrid.innerHTML='';
    const entries=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],'ko'));
    if(!entries.length) els.taskGrid.innerHTML='<div class="empty">선택 조건에 해당하는 지표가 없습니다.</div>';
    entries.forEach(([key,rows],idx)=>{
      const parts=key.split('|'); const task=parts[0],u=parts[1]||rows[0].대학;
      const card=document.createElement('div'); card.className='task-card'; card.style.animationDelay=(idx*35)+'ms';
      card.innerHTML='<div class="task-head"><strong>'+task+'</strong><em>'+u+'</em></div>'+
        slots.map(s=>{
          const r=rows.find(x=>x.구분===s);
          const width=r?Math.max(0,Math.min(r.달성률,100)):0;
          return '<div class="metric"><span>'+s+'</span><div class="track"><div class="bar" data-w="'+width+'" style="background:'+colors[s]+'"></div></div><b>'+(r?fmt(r.달성률)+'%':'-')+'</b></div>';
        }).join('');
      els.taskGrid.appendChild(card);
    });
    requestAnimationFrame(()=>requestAnimationFrame(()=>els.taskGrid.querySelectorAll('.bar').forEach(b=>b.style.width=b.dataset.w+'%')));

    const states=['달성','주의','관리','위험'];
    const counts=Object.fromEntries(states.map(s=>[s,d.filter(x=>status(x.달성률)===s).length]));
    let cursor=0,stops=[];
    states.forEach(s=>{const p=d.length?counts[s]/d.length*100:0;stops.push(stateColors[s]+' '+cursor+'% '+(cursor+p)+'%');cursor+=p;});
    els.donut.style.background='conic-gradient('+stops.join(',')+')';
    els.donutTotal.textContent=d.length;
    els.legend.innerHTML=states.map(s=>'<div><span><i style="background:'+stateColors[s]+'"></i>'+s+'</span><b>'+counts[s]+'</b></div>').join('');

    const risks=d.filter(x=>x.달성률<100).sort((a,b)=>a.달성률-b.달성률).slice(0,6);
    els.riskList.innerHTML=risks.length?risks.map((x,i)=>'<div class="risk-item" style="animation-delay:'+(i*45)+'ms"><span>'+x.단위과제+'</span><div><b>'+x.지표명+'</b><small>'+x.대학+' · '+x.구분+'</small></div><strong>'+fmt(x.달성률)+'%</strong></div>').join(''):'<div class="empty">관리대상 지표가 없습니다.</div>';

    const us=uniq(d.map(x=>x.대학));
    els.univList.innerHTML=us.length?us.map(u=>{const a=d.filter(x=>x.대학===u),r=pctDone(a);return '<div class="univ-row"><span>'+u+'</span><div class="track large"><i class="bar" data-w="'+r+'" style="background:#B40059"></i></div><b>'+r.toFixed(1)+'%</b></div>';}).join(''):'<div class="empty">대학별 데이터가 없습니다.</div>';
    requestAnimationFrame(()=>requestAnimationFrame(()=>els.univList.querySelectorAll('.bar').forEach(b=>b.style.width=b.dataset.w+'%')));

    els.summaryText.textContent=d.length+'개 지표';
    els.summaryBox.innerHTML='<b style="color:#B40059">'+done+'개</b> 달성 · '+(d.length-done)+'개 관리 필요<br>핵심지표 '+core.length+'개 · 자율지표 '+auto.length+'개<br>선택: '+[els.univ.options[els.univ.selectedIndex].text,els.task.options[els.task.selectedIndex].text,els.type.options[els.type.selectedIndex].text,els.state.options[els.state.selectedIndex].text].join(' / ');
  }

  els.form.addEventListener('submit',e=>{e.preventDefault();render();});
  [els.univ,els.task,els.type,els.state].forEach(el=>el.addEventListener('change',render));
  render();
})();
</script>
</body>
</html>
